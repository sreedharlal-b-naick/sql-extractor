[project]
name = "sql-query-extractor"
version = "0.1.0"
description = "Extract SQL queries from code"
authors = [
    {name = "Sreedharlal B Naick",email = "dev.sreedharlal.b.naick@gmail.com"}
]
readme = "README.md"

[tool.poetry]
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.10"
typer = "^0.9.0"
pocketflow = "^0.0.1"
openai = "^1.76.0"
python-dotenv = "^1.1.0"
gitpython = "^3.1.44"
requests = "^2.32.3"
streamlit = "^1.32.0"

[tool.poetry.group.dev.dependencies]
black = "^24.4.2"
pytest = "^7.0"

[tool.poetry.scripts]
cli = "app.cli:app"
web = "app.web:app"

[tool.black]
line-length = 140
target-version = ['py310', 'py311', 'py312', 'py313']
extend-exclude = "examples/*"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"